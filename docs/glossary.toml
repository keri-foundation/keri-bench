# The glossary, written once (this.i 4wnur86k). scripts/glossary writes docs/glossary.md from this
# file, and a test fails when the committed page differs from what this file produces. The site
# assembler (tools/site_source.py) turns every `hover` spelling into an abbreviation, so the site
# shows the term's meaning on hover wherever that spelling appears: on every page for scope "all",
# the default, and only on run reports for scope "reports", which is for words such as "verified"
# that are milestones in a report's tables but plain English in a write-up's prose. Hover matches
# whole words, case-sensitively, outside code. A term with no `hover` shows no hover: leave it off
# a word that fills every page, such as issuer, where an underline on each would bury the ones that
# help. Keep `meaning` to one paragraph; links in it work
# on the glossary page and are reduced to their text on hover.

intro = "The words these pages use without stopping to explain them. KERI's own terms follow the [KERI specification](https://trustoverip.github.io/kswg-keri-specification/) and the [ACDC specification](https://trustoverip.github.io/kswg-acdc-specification/); the definitions here are short and practical, not normative. On the site, a dotted underline under a word means hovering over it shows its meaning from this page."

[[section]]
title = "What is being measured"

[[section.term]]
name = "KERI-006"
hover = ["KERI-006"]
meaning = "The State of Utah's request for \"load and soak tests covering throughput, persistence, concurrency, restart recovery, witnessing, TEL replay, and wallet delivery\", whose numbers feed a decision about hardware. keri-bench is the instrument built to answer it."

[[section.term]]
name = "SEDI"
hover = ["SEDI"]
meaning = "State-Endorsed Digital Identity, Utah's program of digital credentials issued by the State. Utah expects up to a million SEDI credentials over a decade."

[[section.term]]
name = "Issuance, end to end"
meaning = "Everything from a request for a credential until an independent verifier accepts it: building it, recording it in its registry, getting that record witnessed and published, delivering it to the holder, and the holder presenting it."

[[section.term]]
name = "Utah's targets"
meaning = "The numbers Utah gave on 2026-10-25: at most 10,000 credentials a day, a million in stock, revocations reaching verifiers within 30 minutes, no crash-recovery target yet, and a network HSM doing thousands of signatures a second."

[[section]]
title = "KERI and ACDC"

[[section.term]]
name = "KERI"
hover = ["KERI"]
meaning = "Key Event Receipt Infrastructure. A way to give an identifier its own verifiable history of key changes, so that anyone can check who controls it without trusting a central registry."

[[section.term]]
name = "KEL"
hover = ["KEL", "KELs"]
meaning = "Key event log. The signed, hash-chained history of one identifier's keys. An issuer's KEL grows with every credential it issues here, because each issuance is anchored in it, and several findings turn on that growth."

[[section.term]]
name = "ACDC"
hover = ["ACDC"]
meaning = "Authentic Chained Data Container, KERI's verifiable credential format. \"Credential\" on these pages means an ACDC."

[[section.term]]
name = "TEL and registry"
hover = ["TEL"]
meaning = "A transaction event log records whether credentials in a registry are issued or revoked, and is anchored in the issuer's KEL. A verifier checks a credential's current state there."

[[section.term]]
name = "Witness"
meaning = "A server that an identifier's controller names to receipt its key events, so that others can trust what the KEL says. The runs here use three witnesses."

[[section.term]]
name = "toad"
hover = ["toad"]
meaning = "The number of witness receipts an event needs before it counts. These runs use two of three, so one witness can be down without stopping issuance."

[[section.term]]
name = "Rotation"
meaning = "A KEL event that replaces an identifier's keys with new ones."

[[section.term]]
name = "Interaction event (ixn)"
hover = ["ixn"]
meaning = "A KEL event that records something, such as a registry update, without changing keys. Each credential issued here adds one to the issuer's KEL."

[[section.term]]
name = "Grant"
meaning = "The message that offers a credential to its holder. In these runs the issuer hands it back to the caller, and the harness delivers it."

[[section.term]]
name = "Ed25519, Blake3-256"
hover = ["Ed25519", "Blake3-256"]
meaning = "The signature and digest algorithms KERI uses by default."

[[section.term]]
name = "SAID"
hover = ["SAID", "SAIDs"]
meaning = "Self-addressing identifier: a digest of a piece of content, embedded in that content. A credential is identified by its SAID, so \"two SAIDs\" for one credential would mean it was issued twice with different content."

[[section.term]]
name = "HSM"
hover = ["HSM"]
meaning = "Hardware security module: a device that holds signing keys and signs with them without ever releasing them. Utah expects to use a Thales network HSM."

[[section]]
title = "The roles, and the stack that played them"

[[section.term]]
name = "Issuer"
meaning = "The party that issues credentials: here, one issuing service with its own store, its own issuing identifier and its own KEL. Runs use one issuer or three. Credentials are dealt to the issuers in turn, so three issuers share the load three ways and each grows its own KEL a third as fast. Scenario and results names say this as `1home` and `3homes`, imbu's word for an issuer instance."

[[section.term]]
name = "Client"
meaning = "A controller key authorised to ask an issuer for credentials, with its own connections. Runs use one or four clients per issuer."

[[section.term]]
name = "Holder"
meaning = "The citizen's side: the wallet that receives a credential, stores it and presents it to a verifier."

[[section.term]]
name = "Verifier"
meaning = "An independent party that checks a presented credential, including whether it has been revoked."

[[section.term]]
name = "Witness pool"
meaning = "The witnesses that receipt the issuer's key events. These runs use three, with a toad of two."

[[section.term]]
name = "State distribution"
meaning = "Whatever carries a registry's current state from the issuer to verifiers. In these runs, the Registrar and the Observer."

[[section.term]]
name = "imbu"
hover = ["imbu"]
meaning = "Bakobo's issuing service, which plays the issuer in these runs. It accepts requests for credentials over HTTP and carries them out as asynchronous operations."

[[section.term]]
name = "heti"
hover = ["heti"]
meaning = "Bakobo's library for taking part in KERI and ACDC. These runs use it for the holder, the verifier, the Observer and the external signer."

[[section.term]]
name = "keripy"
hover = ["keripy"]
meaning = "The reference Python implementation of KERI, which the witnesses run and heti builds on."

[[section.term]]
name = "Registrar"
hover = ["Registrar"]
meaning = "The service the issuer publishes each registry update to, so that verifiers can learn a credential's current state. A credential counts as published when the Registrar has acknowledged it."

[[section.term]]
name = "Observer"
hover = ["Observer"]
meaning = "heti's component that follows what the Registrar publishes and holds each registry's current chain, so a verifier can check that a credential is still valid."

[[section.term]]
name = "`Prefer: wait`"
meaning = "An HTTP request header asking imbu to answer only when an operation has finished, instead of answering at once and being polled. It changes how many signed responses, and so how many signatures, a credential costs."

[[section]]
title = "How the harness measures"

[[section.term]]
name = "Milestone"
meaning = "A named moment in a credential's life, such as `requested`, `witnessed`, `stored` or `verified`. The [test plan](test-plan.md) defines each one by the event that counts, and [Adapters](adapters.md) says how this stack shows it. Each is defined below, under Milestones."

[[section.term]]
name = "Interval"
meaning = "The time between two milestones, written `start->end`, such as `delivered->stored`."

[[section.term]]
name = "The seven pairs"
meaning = "Seven pairs of things Utah asked to be measured apart, such as building a credential versus updating its registry. Each run report has a section for them."

[[section.term]]
name = "Open loop"
hover = ["open loop", "open-loop"]
meaning = "Requests are sent on a fixed timetable whatever the system does. A system that falls behind therefore builds a visible backlog, instead of quietly slowing the arrivals and hiding its queueing delay."

[[section.term]]
name = "Offered load"
hover = ["offered load"]
meaning = "How many credentials a second the harness asks for. Achieved throughput is how many a second actually reached a milestone."

[[section.term]]
name = "Fault proxy"
hover = ["fault proxy"]
meaning = "A proxy the harness puts on every link between the parts of the stack. It records the traffic and is where faults are injected, so a fault happens on the wire rather than inside the code under test."

[[section.term]]
name = "TEL replay"
hover = ["TEL replay"]
meaning = "Rebuilding a registry's state by reading its whole log, as a verifier does the first time it meets a registry; the reports call it a full sync."

[[section.term]]
name = "Saturation"
meaning = "The offered load past which achieved throughput stops rising and latency climbs without limit."

[[section.term]]
name = "p50, p90, p99, p99.9"
hover = ["p50", "p90", "p99", "p99.9"]
meaning = "Percentiles. p50 is the median: half the credentials took less. p99 is the time 99 credentials in 100 beat. The tail shows stalls that a median hides."

[[section.term]]
name = "Soak"
meaning = "A long run that watches whether latency grows as the store fills."

[[section.term]]
name = "Preseeded"
hover = ["preseeded"]
meaning = "A run that starts from a store already filled with credentials through the same stack, to measure behaviour at that stock."

[[section.term]]
name = "Fault"
meaning = "A deliberate failure injected during a run, such as killing a process (a crash) or stopping a witness for a while (an outage)."

[[section.term]]
name = "Calibration"
meaning = "A run against a synthetic stack whose delays and capacity are known in advance, which measures how accurately the harness itself measures."

[[section.term]]
name = "Refused run"
meaning = "A run the harness would not report, because its own timetable slipped or a fault it was told to inject failed. Refused runs are kept and listed, never silently dropped."

[[section]]
title = "Milestones"

[[section.term]]
name = "`requested`"
hover = ["requested"]
scope = "reports"
meaning = "The scheduled send time of the request, on the harness's clock. Latency is measured from here, so a request the system made wait counts its wait."

[[section.term]]
name = "`accepted`"
hover = ["accepted"]
scope = "reports"
meaning = "The issuer acknowledged the request."

[[section.term]]
name = "`constructed`"
hover = ["constructed"]
scope = "reports"
meaning = "The credential's body exists, as reported by the issuer."

[[section.term]]
name = "`registry_updated`"
hover = ["registry_updated"]
scope = "reports"
meaning = "The registry event recording the issuance exists."

[[section.term]]
name = "`anchored`"
hover = ["anchored"]
scope = "reports"
meaning = "The key event that seals the registry event into the issuer's KEL is signed by the issuer."

[[section.term]]
name = "`witnessed`"
hover = ["witnessed"]
scope = "reports"
meaning = "Enough witnesses have receipted that event to reach the toad."

[[section.term]]
name = "`published`"
hover = ["published"]
scope = "reports"
meaning = "State distribution acknowledged the registry event, so verifiers can learn of it."

[[section.term]]
name = "`grant_sent`"
hover = ["grant_sent"]
scope = "reports"
meaning = "The grant offering the credential left the issuer's side."

[[section.term]]
name = "`delivered`"
hover = ["delivered"]
scope = "reports"
meaning = "The holder's endpoint accepted the grant."

[[section.term]]
name = "`stored`"
hover = ["stored"]
scope = "reports"
meaning = "The holder admitted the credential and kept it."

[[section.term]]
name = "`proof_generated`"
hover = ["proof_generated"]
scope = "reports"
meaning = "The holder produced a presentation of the credential."

[[section.term]]
name = "`verified`"
hover = ["verified"]
scope = "reports"
meaning = "The independent verifier accepted the presentation as valid."

[[section.term]]
name = "`revocation_requested`, `revocation_anchored`, `revocation_witnessed`, `revocation_published`"
hover = ["revocation_requested", "revocation_anchored", "revocation_witnessed", "revocation_published"]
scope = "reports"
meaning = "The same moments as for issuance, for the event that revokes the credential."

[[section.term]]
name = "`revocation_recognised`"
hover = ["revocation_recognised"]
scope = "reports"
meaning = "The first time after which every later check by the verifier says the credential is revoked."

[[section.term]]
name = "`sync_full_started`, `sync_full_done`"
hover = ["sync_full_started", "sync_full_done"]
scope = "reports"
meaning = "A verifier meeting registries cold began and finished reading them in full, the TEL replay."

[[section.term]]
name = "`sync_increment_applied`"
hover = ["sync_increment_applied"]
scope = "reports"
meaning = "A verifier applied one incremental update to a registry it already knew."

[[section]]
title = "Reading the citations"

[[section.term]]
name = "`this.i` and its ids"
meaning = "The repository's record of its design decisions and the reasons for them. An id such as `0hykugwr` names one decision; its text is in [`this.i`](https://github.com/keri-foundation/keri-bench/blob/main/this.i) and can be found there by searching for the id."

[[section.term]]
name = "Commit hashes"
meaning = "Short hexadecimal strings such as `imbu 670a3d8` or `heti a830fcd` name the exact version of a component that was measured, so a run can be repeated on the same code."

[[section.term]]
name = "Error codes"
meaning = "Codes such as `e.party.imbu.refused.f` are a component's own name for a failure. The last letter says whether retrying could help: `r` retryable, `f` final."

[[section.term]]
name = "`@` ids"
meaning = "Ids such as `@7qgv63f5` are cross-references into other Bakobo repositories' design records."

[[section.term]]
name = "Ticks, `~26me`"
meaning = "Ids in the repository's task ledger: a known gap or follow-up that is tracked rather than forgotten."

[[section.term]]
name = "Work names, `imbu-prj`, `heti-dead-lane`, `bench-stock-2`"
meaning = "The names of the pieces of work that changed the code being measured, or that ran a measurement."
